name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: jdx/mr-boxington-action@v1

      - name: Run tests
        run: mbx test --locked --all-targets

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: jdx/mr-boxington-action@v1

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: mbx clippy --locked --workspace --all-targets --all-features -- -D warnings
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: jdx/mr-boxington-action@v1

      - name: Build
        run: mbx build --locked --release

  create_release:
    needs: [test, lint, build]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true

  upload_assets:
    needs: create_release
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: jdx/mr-boxington-action@v1

      - name: Build release binary
        run: mbx build --locked --release

      - name: Package release artifact
        id: package
        shell: bash
        run: |
          BIN=dotagent
          ARCHIVE="${BIN}_${RUNNER_OS}_${RUNNER_ARCH}.tar.gz"
          mkdir -p dist
          tar -czf "dist/${ARCHIVE}" -C target/release "${BIN}"
          echo "archive=dist/${ARCHIVE}" >> "$GITHUB_OUTPUT"

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.package.outputs.archive }}
